<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="width=1920, initial-scale=1.0, user-scalable=no" name="viewport" />
    <title>Streamix</title>
    <style>
      html,
      body,
      * {
        padding: 0;
        margin: 0;
        overflow: hidden;
      }

      body {
        width: 1920px;
        height: 1080px;
        background: #0a0a0f;
      }

      /* Splash screen — visible from the very first frame the TV can paint
         (index.html is served before the JS bundle is parsed). Fades out
         through the `.app-ready` class added by bootstrap after render(). */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(135deg, rgba(229, 9, 20, 0.12), transparent 38%),
          linear-gradient(180deg, #0f1017 0%, #090a10 100%);
        opacity: 1;
        transition: opacity 420ms ease-out;
        pointer-events: none;
      }

      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 78%);
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 78%);
      }

      body.app-ready #splash {
        opacity: 0;
      }

      #splash .splash-shell {
        position: relative;
        width: 560px;
        min-height: 300px;
        padding: 42px;
        border-radius: 8px;
        background: rgba(17, 18, 25, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.44),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        animation: splash-fade-in 520ms ease-out both;
      }

      #splash .brand-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      #splash .logo-tile {
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(229, 9, 20, 0.2), rgba(229, 9, 20, 0.08));
        border: 1px solid rgba(229, 9, 20, 0.28);
      }

      #splash .logo {
        width: 62px;
        height: 62px;
        filter: drop-shadow(0 12px 24px rgba(229, 9, 20, 0.38));
      }

      #splash .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 46px;
        line-height: 1;
        letter-spacing: 0;
        font-weight: 700;
        color: #ffffff;
      }

      #splash .tagline {
        margin-top: 10px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        letter-spacing: 0;
        color: rgba(255, 255, 255, 0.58);
      }

      #splash .splash-divider {
        height: 1px;
        margin: 34px 0 28px;
        background: linear-gradient(90deg, rgba(229, 9, 20, 0.62), rgba(255, 255, 255, 0.08), transparent);
      }

      #splash .splash-status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        color: rgba(255, 255, 255, 0.72);
      }

      #splash .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #e50914;
        box-shadow: 0 0 18px rgba(229, 9, 20, 0.72);
        animation: splash-dot 1.4s ease-in-out infinite;
      }

      #splash .splash-track {
        position: relative;
        height: 6px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
      }

      #splash .splash-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 46%;
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(229, 9, 20, 0.32), #e50914, #ff4a53);
        animation: splash-progress 1.65s ease-in-out infinite;
      }

      @keyframes splash-fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes splash-dot {
        0%,
        100% {
          opacity: 0.42;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes splash-progress {
        0% {
          transform: translateX(-120%);
        }
        55%,
        100% {
          transform: translateX(240%);
        }
      }
    </style>
  </head>

  <body tabindex="0">
    <div id="app"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-shell">
        <div class="brand-row">
          <div class="logo-tile">
            <img class="logo" src="assets/streamix-logo.png" alt="" />
          </div>
          <div>
            <div class="wordmark">Streamix</div>
            <div class="tagline">Entretenimento pronto para sua TV</div>
          </div>
        </div>
        <div class="splash-divider"></div>
        <div class="splash-status">
          <span class="status-dot"></span>
          <span>Preparando sua sessão</span>
        </div>
        <div class="splash-track">
          <div class="splash-bar"></div>
        </div>
      </div>
    </div>
    <!-- Debug overlay visible on TV when devtools are not available.
 Captures JS errors and console.error/console.warn, then renders on top. -->
    <div
      id="err-overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        max-height: 1080px;
        z-index: 99999;
        background: #7a0000e6;
        color: #fff;
        font-family: monospace;
        font-size: 22px;
        padding: 24px;
        overflow-y: auto;
        display: none;
        white-space: pre-wrap;
        line-height: 1.4;
      "
    ></div>
    <script>
      // Overlay only activates with #debug in the hash or localStorage.streamix_debug=1
      (function () {
        var isDebug =
          location.hash.indexOf("debug") !== -1 ||
          (function () {
            try {
              return localStorage.getItem("streamix_debug") === "1";
            } catch (e) {
              return false;
            }
          })();
        if (!isDebug) return;
        var box = document.getElementById("err-overlay");
        var lines = [];

        function show(msg) {
          lines.push(msg);
          if (lines.length > 40) lines.shift();
          box.textContent = lines.join("\n");
          box.style.display = "block";
        }

        window.addEventListener("error", function (e) {
          show("[error] " + (e.message || "?") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          show("[promise] " + ((r && (r.stack || r.message)) || r));
        });
        var oldErr = console.error;
        console.error = function () {
          show("[err] " + Array.prototype.join.call(arguments, " "));
          oldErr.apply(console, arguments);
        };
      })();
    </script>
    <script src="src/index.tsx" type="module"></script>
  </body>
</html>
