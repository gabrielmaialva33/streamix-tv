<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="width=1920, initial-scale=1.0, user-scalable=no" name="viewport" />
    <title>Streamix</title>
    <!-- Pre-warm DNS for the API host so the very first auth call doesn't pay
         the resolution latency (~100-300ms on Fire TV's slow lookup). -->
    <link rel="dns-prefetch" href="https://streamix.mahina.cloud" />
    <link rel="preconnect" href="https://streamix.mahina.cloud" crossorigin />
    <style>
      html,
      body,
      * {
        padding: 0;
        margin: 0;
        overflow: hidden;
      }

      body {
        width: 100vw;
        height: 100vh;
        background: #0a0a0f;
      }

      /* LightningJS canvas — renderer sets the backing-store size to the
         appWidth/appHeight resolution; we stretch the CSS box to fill the
         full viewport so the same scene fits 720p, 1080p, and 4K without
         changing coordinates. */
      #app {
        position: absolute;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* TV-overscan safe zone — most consumer TVs trim 2-5% of each edge.
         Only applied when the bootstrap detects a real Fire TV / Tizen /
         webOS device (toggled via body.tv-overscan). Emulators and PC
         browsers keep the full viewport. */
      body.tv-overscan #app {
        padding: 4vh 4vw;
        box-sizing: border-box;
      }

      /* Splash screen — visible from the very first frame the TV can paint
         (index.html is served before the JS bundle is parsed). Fades out
         through the `.app-ready` class added by bootstrap after render().
         Everything sized with clamp()/vw/vh so it adapts from 720p TVs all
         the way up to 4K signage; only the LightningJS canvas downstream is
         pinned to 1920×1080. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 1.6vh, 28px);
        background:
          radial-gradient(120% 80% at 50% 30%, rgba(229, 9, 20, 0.18), transparent 55%),
          radial-gradient(140% 90% at 50% 90%, rgba(229, 9, 20, 0.08), transparent 60%),
          linear-gradient(180deg, #16080b 0%, #0a0a12 60%, #050507 100%);
        opacity: 1;
        transition: opacity 480ms ease-out;
        pointer-events: none;
      }

      /* Faint dot/grid texture for depth, fades out toward the bottom so
         it doesn't compete with the loader at the foot of the screen. */
      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: clamp(48px, 5vw, 96px) clamp(48px, 5vw, 96px);
        -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        opacity: 0.6;
        pointer-events: none;
      }

      /* Cinematic vignette ring around the edges. */
      #splash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
        pointer-events: none;
      }

      body.app-ready #splash {
        opacity: 0;
      }

      /* Logo — the hero element. Pulses gently while the bundle loads. */
      #splash .logo {
        position: relative;
        width: clamp(160px, 22vw, 320px);
        height: clamp(160px, 22vw, 320px);
        filter: drop-shadow(0 clamp(8px, 1.5vh, 28px) clamp(20px, 4vw, 60px) rgba(229, 9, 20, 0.42));
        animation:
          splash-pop 720ms cubic-bezier(0.16, 1, 0.3, 1) both,
          splash-pulse 3.2s ease-in-out 720ms infinite;
        z-index: 1;
      }

      /* "STREAMIX" wordmark — bold and confident, second in hierarchy. */
      #splash .wordmark {
        position: relative;
        font-family:
          "NotoSans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-weight: 700;
        font-size: clamp(40px, 7vw, 96px);
        line-height: 1;
        letter-spacing: clamp(2px, 0.4vw, 6px);
        color: #ffffff;
        text-transform: uppercase;
        text-shadow: 0 clamp(4px, 0.8vh, 16px) clamp(16px, 2vw, 40px) rgba(229, 9, 20, 0.35);
        animation: splash-rise 720ms cubic-bezier(0.16, 1, 0.3, 1) 180ms both;
        z-index: 1;
      }

      /* Tagline — softer, supporting copy. */
      #splash .tagline {
        position: relative;
        font-family:
          "NotoSans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-weight: 400;
        font-size: clamp(14px, 1.4vw, 22px);
        letter-spacing: clamp(1px, 0.2vw, 4px);
        color: rgba(255, 255, 255, 0.55);
        text-transform: uppercase;
        animation: splash-rise 720ms cubic-bezier(0.16, 1, 0.3, 1) 360ms both;
        z-index: 1;
      }

      /* Loader — minimal shimmer bar pinned near the bottom (safe-zone aware). */
      #splash .splash-track {
        position: absolute;
        left: 50%;
        bottom: clamp(60px, 11vh, 140px);
        transform: translateX(-50%);
        width: clamp(220px, 28vw, 480px);
        height: clamp(2px, 0.3vh, 4px);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
        z-index: 1;
      }

      #splash .splash-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #ff5560 30%, #ff8088 50%, #ff5560 70%, transparent);
        animation: splash-shimmer 1.6s ease-in-out infinite;
      }

      @keyframes splash-pop {
        from {
          opacity: 0;
          transform: scale(0.86);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.025);
        }
      }

      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(clamp(12px, 1.5vh, 24px));
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes splash-shimmer {
        0% {
          transform: translateX(-120%);
        }
        55%,
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>

  <body tabindex="0">
    <div id="app"></div>
    <div id="splash" aria-hidden="true">
      <img class="logo" src="assets/streamix-logo.png" alt="" />
      <div class="wordmark">Streamix</div>
      <div class="tagline">Entretenimento pronto para sua TV</div>
      <div class="splash-track">
        <div class="splash-bar"></div>
      </div>
    </div>
    <!-- Debug overlay visible on TV when devtools are not available.
 Captures JS errors and console.error/console.warn, then renders on top. -->
    <div
      id="err-overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        max-height: 1080px;
        z-index: 99999;
        background: #7a0000e6;
        color: #fff;
        font-family: monospace;
        font-size: 22px;
        padding: 24px;
        overflow-y: auto;
        display: none;
        white-space: pre-wrap;
        line-height: 1.4;
      "
    ></div>
    <script>
      // Toggle the TV-overscan safe-zone padding only on hardware that can
      // actually crop edges (Fire TV sticks behind an HDMI input, webOS).
      // Samsung Tizen renders web apps straight on the panel compositor with
      // no overscan — and its emulator carries the same UA — so Tizen gets
      // the full viewport; the Lightning layout already reserves its own
      // safe margins (shared/layout.ts SAFE_AREA_*).
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isFireTV = /AFT/.test(ua);
          var isWebOS = /Web0S|webOS/.test(ua);
          if (isFireTV || isWebOS) {
            document.body.classList.add("tv-overscan");
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Always-on error overlay: this is the only way to surface errors on
      // an embedded TV without devtools. Captures uncaught errors, unhandled
      // rejections, console.error, and a 30s splash watchdog.
      (function () {
        var box = document.getElementById("err-overlay");
        var lines = [];
        var startedAt = Date.now();

        function show(msg) {
          lines.push(msg);
          if (lines.length > 40) lines.shift();
          box.textContent = lines.join("\n");
          box.style.display = "block";
        }

        window.addEventListener("error", function (e) {
          show("[error] " + (e.message || "?") + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason;
          show("[promise] " + ((r && (r.stack || r.message)) || r));
        });
        // Suppress noisy logger scopes that already render their own friendly
        // UI. The overlay should only surface unexpected errors — playback
        // failures have a dedicated card in PlayerPage, so flooding the screen
        // with raw stack traces just hides it.
        var SUPPRESSED_SCOPES =
          /^\[(PlayerPage|HTML5Player|HLSPlayer|TizenAVPlay|FireTVPlayer|PlayerManager)\]/;
        var oldErr = console.error;
        console.error = function () {
          var first = arguments[0];
          if (typeof first === "string" && SUPPRESSED_SCOPES.test(first)) {
            oldErr.apply(console, arguments);
            return;
          }
          show("[err] " + Array.prototype.join.call(arguments, " "));
          oldErr.apply(console, arguments);
        };

        // Splash watchdog: if the app never signals "streamix:ready", surface
        // a visible failure instead of leaving the user stuck on the spinner.
        var readied = false;
        window.addEventListener("streamix:ready", function () {
          readied = true;
        });
        setTimeout(function () {
          if (readied) return;
          var elapsed = ((Date.now() - startedAt) / 1000).toFixed(1);
          show(
            "[watchdog] App did not boot after " +
              elapsed +
              "s.\nLikely causes: network, CORS, API URL.\n" +
              "API: " +
              (window.__APP_ENV__ ? window.__APP_ENV__.VITE_API_URL : "unknown") +
              "\nUA: " +
              navigator.userAgent,
          );
        }, 30000);
      })();
    </script>
    <script>
      // Older WebView versions on Fire OS / Tizen don't ship the
      // SpeechSynthesisErrorEvent constructor at all, so any `instanceof`
      // check crashes with ReferenceError. @lightningtv/solid uses it in
      // its announcer's catch block, which is enabled by default in
      // AppShell. Provide a no-op shim before any bundle code runs.
      if (typeof SpeechSynthesisErrorEvent === "undefined") {
        window.SpeechSynthesisErrorEvent = function SpeechSynthesisErrorEvent() {};
      }
    </script>
    <script>
      // CapacitorHttp.enabled=true is needed so cross-origin API calls
      // (streamix.mahina.cloud) bypass WebView CORS. But Capacitor patches
      // both window.fetch *and* window.XMLHttpRequest, which breaks loading
      // bundled assets at https://localhost/* (LightningJS uses XHR for SDF
      // font atlases). Solution: keep fetch patched (so the API works), but
      // restore the original XMLHttpRequest so local assets resolve via the
      // Capacitor asset server. Cross-origin XHRs (image proxy etc.) are
      // handled selectively by src/platform/nativeImageXhr.ts.
      (function () {
        var cap = window.Capacitor;
        if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;

        // Rewire fetch: same-origin -> browser fetch, cross-origin -> patched.
        var browserFetch = window.CapacitorWebFetch || window.fetch.bind(window);
        var nativeFetch = window.fetch.bind(window);
        var origin = location.origin;
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input && (input.url || "");
          try {
            if (new URL(url, origin).origin === origin) {
              return browserFetch(input, init);
            }
          } catch (e) {}
          return nativeFetch(input, init);
        };

        // Restore the un-patched XMLHttpRequest constructor.
        var web = window.CapacitorWebXMLHttpRequest;
        var orig = (web && web.fullObject) || null;
        if (orig && window.XMLHttpRequest !== orig) {
          window.XMLHttpRequest = orig;
        }
      })();
    </script>
    <script src="src/index.tsx" type="module"></script>
  </body>
</html>
