name: Build Tizen WGT

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: "Attach .wgt to a GitHub Release"
        type: boolean
        default: false

# Secrets required (Settings -> Secrets and variables -> Actions):
#   TIZEN_AUTHOR_P12        base64 -w0 < ~/SamsungCertificate/StreamixTV/author.p12
#   TIZEN_DISTRIBUTOR_P12   base64 -w0 < ~/SamsungCertificate/StreamixTV/distributor.p12
#   TIZEN_CERT_PASSWORD     senha dos dois p12 (mesma)

env:
  TIZEN_STUDIO_VERSION: "5.6"
  TIZEN_PROFILE: StreamixTV
  PACKAGE_ID: EI8qhrd7xh.streamix
  NODE_VERSION: "24"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build (Tizen target)
        run: pnpm build:tizen

      - name: Setup Java 17 (Tizen CLI requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Tizen Studio installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: ~/tizen-studio_${{ env.TIZEN_STUDIO_VERSION }}.bin
          key: tizen-studio-installer-${{ env.TIZEN_STUDIO_VERSION }}

      - name: Cache Tizen Studio install
        id: cache-studio
        uses: actions/cache@v4
        with:
          path: ~/tizen-studio
          key: tizen-studio-${{ env.TIZEN_STUDIO_VERSION }}-tv-samsung-10

      - name: Download Tizen Studio
        if: steps.cache-installer.outputs.cache-hit != 'true'
        run: |
          wget -nv -O ~/tizen-studio_${{ env.TIZEN_STUDIO_VERSION }}.bin \
            http://download.tizen.org/sdk/Installer/tizen-studio_${{ env.TIZEN_STUDIO_VERSION }}/web-cli_Tizen_Studio_${{ env.TIZEN_STUDIO_VERSION }}_ubuntu-64.bin

      - name: Install Tizen Studio + TV Samsung packages
        if: steps.cache-studio.outputs.cache-hit != 'true'
        run: |
          chmod +x ~/tizen-studio_${{ env.TIZEN_STUDIO_VERSION }}.bin
          ~/tizen-studio_${{ env.TIZEN_STUDIO_VERSION }}.bin --accept-license ~/tizen-studio
          export PATH=$HOME/tizen-studio/tools/ide/bin:$HOME/tizen-studio/tools:$HOME/tizen-studio/package-manager:$PATH
          # Instala packages necessários: cert-add-on + TV web AppDev
          ~/tizen-studio/package-manager/package-manager-cli.bin install \
            cert-add-on \
            TV-Samsung-Public-Cert-Add-on \
            WEB-CLI \
            NativeIDE-CLI \
            certificate-manager \
            TV-samsung-Public_10.0_NativeAppDevelopment-CLI \
            TV-samsung-Public_10.0_WebAppDevelopment-CLI || true

      - name: Decode + re-keystore p12 with 27-char alpha password
        env:
          AUTHOR_B64: ${{ secrets.TIZEN_AUTHOR_P12 }}
          DIST_B64: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
          CERT_PW: ${{ secrets.TIZEN_CERT_PASSWORD }}
        run: |
          set -e
          CERT_DIR="$HOME/SamsungCertificate/${{ env.TIZEN_PROFILE }}"
          TMP=$(mktemp -d)
          mkdir -p "$CERT_DIR"

          printf '%s' "$AUTHOR_B64" | base64 -d > "$TMP/author-old.p12"
          printf '%s' "$DIST_B64"   | base64 -d > "$TMP/distributor-old.p12"
          wc -c "$TMP"/*.p12

          # 27 chars alpha — requisito escondido do Tizen CLI (sourcetoad action README)
          NEW_PW="streamixtvcipipelinepassword"
          echo "::add-mask::$NEW_PW"
          echo "NEW_PW=$NEW_PW" >> "$GITHUB_ENV"

          # Mantém cifra legacy (RC2-40-CBC) que Java do Tizen aceita
          for kind in author distributor; do
            openssl pkcs12 -in "$TMP/${kind}-old.p12" -legacy -nodes \
              -passin "pass:$CERT_PW" -out "$TMP/${kind}.pem"
            openssl pkcs12 -export -legacy -in "$TMP/${kind}.pem" \
              -passout "pass:$NEW_PW" -out "$CERT_DIR/${kind}.p12"
            openssl pkcs12 -in "$CERT_DIR/${kind}.p12" -legacy -passin "pass:$NEW_PW" \
              -nokeys -noout && echo "$kind OK"
          done

          rm -rf "$TMP"
          ls -la "$CERT_DIR"

      - name: Write profiles.xml directly (bypass gnome-keyring)
        run: |
          # GitHub Actions runner não tem gnome-keyring → `tizen security-profiles add`
          # salva senha no vazio. Workaround: escrever XML com senha em plaintext,
          # padrão usado pela sourcetoad/tizen-build-action.
          PROFILES_DIR="$HOME/tizen-studio-data/profile"
          mkdir -p "$PROFILES_DIR"
          CERT_DIR="$HOME/SamsungCertificate/${{ env.TIZEN_PROFILE }}"

          cat > "$PROFILES_DIR/profiles.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="${{ env.TIZEN_PROFILE }}" version="3.1">
            <profile name="${{ env.TIZEN_PROFILE }}">
              <profileitem ca="" distributor="0" key="$CERT_DIR/author.p12" password="$NEW_PW" rootca=""/>
              <profileitem ca="" distributor="1" key="$CERT_DIR/distributor.p12" password="$NEW_PW" rootca=""/>
              <profileitem ca="" distributor="2" key="" password="" rootca=""/>
            </profile>
          </profiles>
          EOF

          export PATH=$HOME/tizen-studio/tools/ide/bin:$PATH
          tizen cli-config "profiles.path=$PROFILES_DIR/profiles.xml"
          tizen cli-config "default.profiles.path=$PROFILES_DIR/profiles.xml"
          echo "--- profiles.xml ---"
          sed 's/password="[^"]*"/password="***"/g' "$PROFILES_DIR/profiles.xml"
          echo "--- list ---"
          tizen security-profiles list

      - name: Package WGT
        run: |
          export PATH=$HOME/tizen-studio/tools/ide/bin:$PATH
          echo "--- dist/tizen ---"
          ls -la dist/tizen/
          echo "--- config.xml ---"
          cat dist/tizen/config.xml 2>&1 | head -30 || echo "no config.xml"
          echo "--- cli-config ---"
          tizen cli-config -l
          echo "--- package ---"
          cd dist/tizen
          tizen package -t wgt -s ${{ env.TIZEN_PROFILE }} -- . || {
            echo "::error::Package failed. Dumping cli.log..."
            tail -100 $HOME/tizen-studio-data/cli/logs/cli.log || true
            exit 1
          }
          ls -la *.wgt

      - name: Compute artifact name
        id: artifact
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          REF="${{ github.ref_name }}"
          NAME="Streamix-${REF//\//-}-${SHORT}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cp dist/tizen/Streamix.wgt "dist/tizen/$NAME.wgt"

      - name: Upload .wgt artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/tizen/Streamix.wgt
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release (only on tag or manual release)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tizen/${{ steps.artifact.outputs.name }}.wgt
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}

      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf ~/SamsungCertificate
          rm -f ~/tizen-studio-data/profile/profiles.xml || true
