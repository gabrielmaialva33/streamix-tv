name: TV navigation and checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm tsc --noEmit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec vitest run
      - run: pnpm test:tv
      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-navigation-failures
          path: tmp/playwright-results
          if-no-files-found: ignore
          retention-days: 7
